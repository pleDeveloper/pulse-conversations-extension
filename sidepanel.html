<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse Conversations</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-text">Pulse Conversations</span>
      </div>
      <div class="topbar-actions">
        <button id="back-btn" class="icon-btn hidden" title="Back to list">&larr;</button>
        <button id="refresh-btn" class="icon-btn hidden" title="Refresh">&#x21bb;</button>
        <button id="settings-btn" class="icon-btn" title="Settings">&#9881;</button>
        <button id="signout-btn" class="icon-btn hidden" title="Sign out">&#x23FB;</button>
      </div>
    </header>

    <div id="context-bar" class="context-bar hidden">
      <div class="context-dot"></div>
      <div class="context-text">
        <div id="context-title">Looking for a match…</div>
        <div id="context-sub" class="muted small"></div>
      </div>
      <button id="context-action" class="secondary">View</button>
    </div>

    <section id="auth-view" class="view hidden">
      <div class="empty">
        <h2>Connect to Salesforce</h2>
        <p id="auth-instance" class="muted"></p>
        <button id="login-btn" class="primary">Sign in</button>
        <p id="auth-error" class="error"></p>
        <p class="muted small">
          Need to configure the org / Connected App?
          <a href="#" id="open-options">Open settings</a>.
        </p>
      </div>
    </section>

    <section id="list-view" class="view hidden">
      <div class="search-row">
        <input id="search-input" type="search" placeholder="Search meetings or patients…" />
      </div>
      <div id="meetings" class="meeting-list"></div>
      <p id="list-status" class="muted small center"></p>
    </section>

    <section id="transcript-view" class="view hidden">
      <div class="transcript-header">
        <div class="transcript-header-text">
          <div id="transcript-title" class="transcript-title"></div>
          <div id="transcript-sub" class="muted small"></div>
        </div>
        <div class="transcript-header-actions">
          <button id="note-btn" class="icon-btn" title="Post a note on this meeting">📝</button>
          <button id="recording-btn" class="icon-btn hidden" title="Open recording in Salesforce">▶</button>
          <button id="open-in-sf" class="icon-btn" title="Open in Salesforce">↗</button>
          <label class="live-toggle">
            <input type="checkbox" id="live-toggle" checked />
            <span>Live</span>
          </label>
        </div>
      </div>

      <div class="tab-bar">
        <button class="tab active" data-tab="transcript">Transcript</button>
        <button class="tab" data-tab="workflow">Workflow</button>
        <button class="tab" data-tab="coaching">Coaching</button>
        <button class="tab" data-tab="insights">Insights</button>
      </div>

      <div id="transcript-pane" class="pane">
        <div class="transcript-toolbar">
          <div class="transcript-search-wrap">
            <input
              id="transcript-search"
              type="search"
              placeholder="Search in transcript…"
              autocomplete="off"
            />
            <span id="transcript-search-count" class="muted small"></span>
          </div>
        </div>
        <div id="speaker-chips" class="speaker-chips"></div>
        <div class="messages-wrap">
          <div id="messages" class="messages"></div>
          <button id="jump-latest" class="jump-latest hidden">
            <span>↓</span> <span id="jump-latest-text">Jump to latest</span>
          </button>
        </div>
        <p id="transcript-status" class="muted small center"></p>
      </div>

      <div id="coaching-pane" class="pane hidden">
        <div class="coaching-toolbar">
          <button id="coaching-generate" class="primary">Generate coaching</button>
          <select id="coaching-mode">
            <option value="next-steps">Next-best actions</option>
            <option value="bant">BANT summary</option>
            <option value="risks">Risk + objection scan</option>
            <option value="followups">Follow-up draft (email)</option>
            <option value="summary">2-paragraph recap</option>
          </select>
          <span id="coaching-meta" class="muted small"></span>
        </div>
        <div id="coaching-output" class="coaching-output"></div>
        <p id="coaching-status" class="muted small center"></p>
      </div>

      <div id="insights-pane" class="pane hidden">
        <div id="insights-list" class="insights-list"></div>
      </div>

      <div id="workflow-pane" class="pane hidden">
        <div id="workflow-header" class="workflow-header"></div>
        <div id="actions-list" class="actions-list"></div>
        <p id="workflow-status" class="muted small center"></p>
      </div>
    </section>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
